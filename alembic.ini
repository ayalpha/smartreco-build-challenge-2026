; ---------------------------------------------------------------------------
; Alembic configuration.
;
; The database URL is intentionally NOT stored here — `alembic/env.py` reads it
; from the application settings (i.e. DATABASE_URL in your .env), so there is a
; single source of truth and no risk of committing a connection string.
; ---------------------------------------------------------------------------

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Timestamped, descriptive revision filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sqlalchemy.url is set programmatically in env.py from app.config.settings.
sqlalchemy.url =

[post_write_hooks]
# Optional formatting hook; enable if you use ruff locally.
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
