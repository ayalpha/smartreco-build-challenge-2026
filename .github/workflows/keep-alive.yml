name: Keep Render App Alive

on:
  schedule:
    # Runs every 5 minutes to prevent the free tier from sleeping
    - cron: '*/5 * * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render URL
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://nexora-9stx.onrender.com/
