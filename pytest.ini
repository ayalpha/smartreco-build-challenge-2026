[pytest]
# The tests import the application as `app.*`, so the repo root must be on the
# path; `rootdir`-relative imports handle that via the `tests/__init__.py` package.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --durations=10

# Keep test output readable: the app logs at WARNING and above during tests.
log_cli = false
log_level = WARNING

filterwarnings =
    default
    # LangChain/LangGraph emit forward-looking deprecation notices we do not control.
    ignore::DeprecationWarning:langchain_core.*
    ignore::DeprecationWarning:langgraph.*
    ignore::PendingDeprecationWarning

markers =
    slow: marks tests that run the full agent graph (deselect with '-m "not slow"')
