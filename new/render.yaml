# ===========================================================================
# Render Blueprint — SmartReco
#
# Optional. You can create the service by hand in the dashboard instead; this
# file just makes it one click (Render reads it automatically when you pick
# "New + -> Blueprint" and point at this repo).
#
# Shape chosen deliberately for FREE hosting:
#   * runtime: docker      -> guarantees Python 3.11; Render's native Python
#                             default drifts and this project needs 3.11+
#   * plan: free           -> 512 MB / 0.1 CPU. Measured footprint is ~170 MB
#                             resident, so there is comfortable headroom.
#   * SQLite, no add-ons   -> zero extra services. The container re-seeds the
#                             catalog and demo accounts on every boot, so the
#                             ephemeral disk is self-healing rather than a
#                             problem. Redis and Qdrant fall back in-process.
#
# NOTE: free web services sleep after ~15 minutes idle and cold-start in ~1
# minute. That is fine for judging; the first request after a sleep is slow,
# every request after it is fast.
# ===========================================================================

services:
  - type: web
    name: smartreco
    # Older Render blueprints spell this `env: docker`; `runtime` is the current
    # key. If your account rejects `runtime`, swap in `env: docker`.
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # --- must be supplied by you -------------------------------------------
      # sync: false means "prompt me in the dashboard, never store it in git".
      - key: MESH_API_KEY
        sync: false

      # --- generated by Render ------------------------------------------------
      # No need to invent one; Render writes a strong random value.
      - key: SECRET_KEY
        generateValue: true

      # --- safe defaults ------------------------------------------------------
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO

      # SQLite on the ephemeral disk. Data resets on redeploy, and that is fine:
      # scripts/start.sh re-seeds the catalog, demo users and a synthetic
      # browsing session on every boot, so the demo always comes up populated.
      # To persist instead, add a Render Postgres and set this to its
      # Internal Database URL.
      - key: DATABASE_URL
        value: sqlite:///./smartreco.db

      # Both intentionally empty -> the app uses its built-in fallbacks:
      # an in-process cache instead of Redis, and an embedded in-memory vector
      # index instead of a Qdrant server (rebuilt from SQL at startup).
      - key: REDIS_URL
        value: ""
      - key: QDRANT_URL
        value: ""

      # Digests are logged rather than sent, so no mail credentials are needed.
      # The scheduler stays on: it is also the background queue for agent runs.
      - key: EMAIL_BACKEND
        value: console
      - key: SCHEDULER_ENABLED
        value: "true"

      # BASE_URL is deliberately omitted — app/config.py reads Render's
      # RENDER_EXTERNAL_URL automatically.